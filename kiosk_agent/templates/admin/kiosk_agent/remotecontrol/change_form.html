{% extends "admin/change_form.html" %}

{% block extrahead %}
{{ block.super }}
<style>
  .status-ready { color: var(--body-fg); font-weight: 600; }
  .status-warning { color: #ba6d00; font-weight: 600; }
  fieldset.ac-config { border-left: 4px solid var(--primary, #417690); }
  fieldset.ac-config > h2, .inline-group .module h2 { font-weight: 700; }
  .inline-related fieldset.module { margin-bottom: 8px; }
  @media (min-width: 1024px) {
    .field-name input, .field-location input, .field-device_name input { min-width: 28rem; }
  }
</style>
{% endblock %}

{% block admin_change_form_document_ready %}
{{ block.super }}
<script>
(() => {
  "use strict";
  const byId = (id) => document.getElementById(id);
  const deviceType = byId("id_device_type");
  const protocol = byId("id_protocol");
  const acSection = document.querySelector("fieldset.ac-config");
  if (!deviceType || !protocol || !acSection) return;
  const updateDeviceType = () => {
    acSection.hidden = deviceType.value !== "ac";
  };

  deviceType.addEventListener("change", updateDeviceType);
  updateDeviceType();
})();
</script>
{% endblock %}
