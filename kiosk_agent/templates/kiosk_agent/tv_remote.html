{% load static %}
<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b5954">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; img-src 'self' data:">
  <title>ريموت تلفاز LG | غروب</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'kiosk_agent/tv_remote.css' %}?v=1">
</head>
<body>
  <header class="tv-app-header">
    <a class="tv-brand" href="{% url 'kiosk-chat' %}" aria-label="العودة إلى غروب">
      <span class="sunset-wordmark" dir="ltr"><span>sun</span><b>S</b><span>et</span></span>
      <span><small>Sunset Resort · منتجع الغروب</small><strong>منتجع الغروب</strong></span>
    </a>
    <nav aria-label="التنقل الرئيسي">
      <a href="{% url 'kiosk-chat' %}">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11 12 4l8 7v9h-6v-6h-4v6H4Z"/></svg>
        الصفحة الرئيسية
      </a>
      <a class="is-current" href="{% url 'tv-remote' %}" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="4"/><circle cx="12" cy="7" r="1.5"/><path d="M9.5 12h5M12 9.5v5"/></svg>
        ريموت التلفاز
      </a>
    </nav>
  </header>

  <main class="tv-page">
    <section class="remote-card" aria-labelledby="remoteTitle">
      <header class="remote-heading">
        <div>
          <small>التحكم بالأجهزة</small>
          <h1 id="remoteTitle"><span dir="ltr">{{ tv_remote.name|default:"LG TV" }}</span></h1>
        </div>
        <div class="remote-status is-checking" id="remoteStatus" role="status" aria-live="polite">
          <span></span><b>جارٍ التحقق…</b>
        </div>
      </header>

      <form class="csrf-token" aria-hidden="true">{% csrf_token %}</form>
      <div class="remote-body" id="remoteControls" data-remote-id="{{ tv_remote.id|default:'' }}">
        <button class="remote-button power-button" type="button" data-command="POWER" aria-label="تشغيل أو إيقاف التلفاز">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v10M6.3 5.3a8 8 0 1 0 11.4 0"/></svg>
        </button>

        <div class="button-row main-controls">
          <button type="button" data-command="INPUT"><span>⌁</span>المدخل</button>
          <button type="button" data-command="HOME"><span>⌂</span>الرئيسية</button>
          <button type="button" data-command="SETTINGS"><span>⚙</span>الإعدادات</button>
        </div>

        <div class="rocker-grid">
          <div class="rocker" aria-label="الصوت">
            <button type="button" data-command="VOL_UP" aria-label="رفع الصوت"><b>+</b><small>VOL</small></button>
            <button type="button" data-command="VOL_DOWN" aria-label="خفض الصوت"><b>−</b><small>VOL</small></button>
          </div>
          <button class="mute-button" type="button" data-command="MUTE"><span>◖</span>كتم</button>
          <div class="rocker" aria-label="القنوات">
            <button type="button" data-command="CH_UP" aria-label="القناة التالية"><b>+</b><small>CH</small></button>
            <button type="button" data-command="CH_DOWN" aria-label="القناة السابقة"><b>−</b><small>CH</small></button>
          </div>
        </div>

        <div class="dpad" aria-label="التنقل">
          <button class="dpad-up" type="button" data-command="UP" aria-label="أعلى">▲</button>
          <button class="dpad-left" type="button" data-command="LEFT" aria-label="يسار">◀</button>
          <button class="dpad-ok" type="button" data-command="OK">OK</button>
          <button class="dpad-right" type="button" data-command="RIGHT" aria-label="يمين">▶</button>
          <button class="dpad-down" type="button" data-command="DOWN" aria-label="أسفل">▼</button>
        </div>

        <div class="button-row utility-controls">
          <button type="button" data-command="BACK"><span>↩</span>رجوع</button>
          <button type="button" data-command="EXIT"><span>×</span>خروج</button>
        </div>

        <div class="number-pad" aria-label="الأرقام">
          <button type="button" data-command="1">1</button><button type="button" data-command="2">2</button><button type="button" data-command="3">3</button>
          <button type="button" data-command="4">4</button><button type="button" data-command="5">5</button><button type="button" data-command="6">6</button>
          <button type="button" data-command="7">7</button><button type="button" data-command="8">8</button><button type="button" data-command="9">9</button>
          <button class="zero" type="button" data-command="0">0</button>
        </div>
      </div>
      <p class="remote-feedback" id="remoteFeedback" role="alert" aria-live="polite"></p>
    </section>
  </main>
  <script src="{% static 'kiosk_agent/tv_remote.js' %}?v=1" defer></script>
</body>
</html>
