[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "wazen_local.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = ["E501", "DJ001", "DJ012"]

[tool.ruff.lint.per-file-ignores]
"kiosk_agent/migrations/*.py" = ["E501", "I001"]
"wazen_local/asgi.py" = ["E402"]
